name: Signed release

on:
  push:
    tags: ["v*", "!v*-preview*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check release credentials
        run: |
          for name in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD \
            BUILD_CERTIFICATE_BASE64 BUILD_CERTIFICATE_PASSWORD \
            DEVELOPER_ID_APPLICATION KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/macpins-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$BUILD_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"

      - name: Build Developer ID app
        env:
          MACPINS_CODE_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: zsh build-app.sh

      - name: Notarize and staple app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/MacPins.app dist/MacPins-notarization.zip
          xcrun notarytool submit dist/MacPins-notarization.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/MacPins.app
          xcrun stapler validate dist/MacPins.app

      - name: Package and notarize downloads
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/MacPins.app dist/MacPins.zip
          zsh scripts/build-dmg.sh
          xcrun notarytool submit dist/MacPins.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/MacPins.dmg
          xcrun stapler validate dist/MacPins.dmg
          shasum -a 256 dist/MacPins.zip dist/MacPins.dmg > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MacPins.dmg \
            dist/MacPins.zip \
            dist/SHA256SUMS.txt \
            --generate-notes \
            --title "MacPins $GITHUB_REF_NAME"
